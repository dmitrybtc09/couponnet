<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CouponNet Multi-Business Wallet</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Зависимости: 3D-движок и наша библиотека анимаций -->
    <script src="https://aframe.io"></script>
    <script src="animations.js"></script>

    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; margin: 0; overflow-x: hidden; }
        button { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; transition: background 0.2s; }
        button:active { filter: brightness(0.9); }
        .box { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-top: 20px; word-break: break-all; font-family: monospace; font-size: 12px; text-align: left; }
        #cameraContainer { width: 100%; max-width: 400px; height: 300px; display: none; margin: 20px auto; border-radius: 12px; border: 2px solid #28a745; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        #arOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; display: none; background: rgba(0,0,0,0.85); }
        .ar-ui { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); z-index: 10000; text-align: center; width: 90%; }
        .congrats-text { font-size: 26px; font-weight: bold; color: #ffca28; margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <h2>🎟️ CouponNet Wallet</h2>
    
    <!-- Баланс -->
    <div style="background: #252525; padding: 20px; border-radius: 12px; margin: 20px 0; border: 1px solid #007bff;">
        <span style="color: #aaa; font-size: 14px; text-transform: uppercase;">Баланс CouponNet</span>
        <div style="font-size: 36px; font-weight: bold; margin-top: 5px; color: #007bff;"><span id="balance">0.00</span> 🪙</div>
    </div>
    
    <button id="generateBtn">Создать кошелек</button>
    <div id="status" style="margin-top: 15px; color: #aaa;">Загрузка...</div>
    <div id="addressBox" class="box" style="display:none;"><b>Ваш адрес:</b><br><span id="address"></span></div>

    <button id="scanBtn" style="background: #28a745; margin-top: 15px;">📷 Включить сканер купонов</button>
    <button id="stopScanBtn" style="background: #dc3545; margin-top: 15px; display: none;">🛑 Отключить сканер</button>

    <div id="cameraContainer"><video id="video" autoplay playsinline></video></div>

    <!-- ТРЕХМЕРНЫЙ СЛОЙ (СЮДА ИНЪЕКТИРУЕТСЯ СЦЕНА) -->
    <div id="arOverlay">
        <div class="ar-ui">
            <div class="congrats-text" id="arRewardText">+0.00 🪙</div>
            <button id="closeArBtn" style="background: #ffca28; color: #121212; font-weight: bold; border-radius: 20px;">Забрать монеты</button>
        </div>
        
        <!-- Сюда скрипт вставит 3D-модели выбранного бизнеса -->
        <a-scene id="dynamicSceneContainer" embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;"></a-scene>
    </div>

    <script>
        const DB_NAME = "CouponNetDB";
        const STORE_NAME = "wallet";
        let db, videoStream, scanInterval;

        // Инициализация базы данных
        const request = indexedDB.open(DB_NAME, 2);
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore(STORE_NAME); };
        request.onsuccess = (e) => { db = e.target.result; checkExistingWallet(); };

        function checkExistingWallet() {
            const tx = db.transaction(STORE_NAME, "readonly");
            tx.objectStore(STORE_NAME).get("keys").onsuccess = (e) => {
                if (e.target.result) {
                    showWallet(e.target.result.publicKey);
                    document.getElementById('generateBtn').style.display = "none";
                    tx.objectStore(STORE_NAME).get("balance").onsuccess = (el) => {
                        document.getElementById('balance').innerText = (el.target.result || 0).toFixed(2);
                        document.getElementById('status').innerText = "📱 Офлайн-кошелек готов к работе";
                    };
                } else { document.getElementById('status').innerText = "👋 Создайте кошелек"; }
            };
        }

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const keyPair = await window.crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put({ publicKey: keyPair.publicKey, privateKey: keyPair.privateKey }, "keys");
            tx.objectStore(STORE_NAME).put(0.00, "balance");
            tx.oncomplete = () => { location.reload(); };
        });

        async function showWallet(pubKey) {
            const exported = await window.crypto.subtle.exportKey("raw", pubKey);
            const hex = Array.from(new Uint8Array(exported)).map(b => b.toString(16).padStart(2, '0')).join('');
            document.getElementById('address').innerText = "0x" + hex.substring(0, 35) + "...";
            document.getElementById('addressBox').style.display = "block";
        }

        // Логика сканирования
        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!('BarcodeDetector' in window)) { alert("BarcodeDetector не поддерживается!"); return; }
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('video').srcObject = videoStream;
                document.getElementById('cameraContainer').style.display = "block";
                document.getElementById('scanBtn').style.display = "none";
                document.getElementById('stopScanBtn').style.display = "block";

                const detector = new BarcodeDetector({ formats: ['qr_code'] });
                scanInterval = setInterval(async () => {
                    const barcodes = await detector.detect(document.getElementById('video'));
                    if (barcodes.length > 0) {
                        const codeData = barcodes[0].rawValue;
                        
                        // Парсим строку вида: couponnet:pizza:100
                        if (codeData.startsWith("couponnet:")) {
                            clearInterval(scanInterval);
                            const parts = codeData.split(":");
                            const businessType = parts[1]; // pizza, coffee, и т.д.
                            const coins = parseFloat(parts[2]);

                            if (!isNaN(coins)) {
                                stopCamera();
                                triggerAR(businessType, coins); // Вызываем динамический рендер
                            }
                        }
                    }
                }, 300);
            } catch (err) { alert(err.message); }
        });

        function triggerAR(businessType, amount) {
            document.getElementById('arRewardText').innerText = `🎁 Начислено +${amount.toFixed(2)} 🪙!`;
            
            // Магия: Передаем тип бизнеса в наш внешний файл анимаций
            CouponNetAnimations.render(businessType, 'dynamicSceneContainer');
            
            document.getElementById('arOverlay').style.display = "block";
            document.getElementById('closeArBtn').onclick = () => {
                document.getElementById('arOverlay').style.display = "none";
                updateBalance(amount);
            };
        }

        function updateBalance(amount) {
            const tx = db.transaction(STORE_NAME, "readwrite");
            const store = tx.objectStore(STORE_NAME);
            store.get("balance").onsuccess = (e) => {
                const newBalance = (e.target.result || 0) + amount;
                store.put(newBalance, "balance");
                tx.oncomplete = () => { document.getElementById('balance').innerText = newBalance.toFixed(2); };
            };
        }

        function stopCamera() {
            if (scanInterval) clearInterval(scanInterval);
            if (videoStream) videoStream.getTracks().forEach(track => track.stop());
            document.getElementById('cameraContainer').style.display = "none";
            document.getElementById('scanBtn').style.display = "block";
            document.getElementById('stopScanBtn').style.display = "none";
        }
    </script>
</body>
</html>
